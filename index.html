<title>Pocket Heights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ol:#2a1a22;--cream:#f3e3c8;--cream2:#dfc6ad;--night:#141020;--orange:#f07a2e;--gold:#f2c14e;--moss:#5fa53a;--blue:#5ab8e8;--pink:#e86a7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Pixelify Sans","Fredoka",ui-rounded,system-ui,sans-serif;background:var(--night);color:var(--ol);overflow:hidden;user-select:none;-webkit-user-select:none}
img{image-rendering:pixelated;image-rendering:crisp-edges}
.px{clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--night)}
#hud{display:flex;gap:6px;padding:9px 10px;background:#1b1626;border-bottom:3px solid #000;color:var(--cream);font-weight:700;font-size:17px;justify-content:space-between;align-items:center;z-index:3}
.pill{background:#2e2540;border:3px solid #000;padding:4px 9px 4px 6px;white-space:nowrap;display:flex;align-items:center;gap:5px;box-shadow:inset 0 2px 0 #4a3a5e}
.pill.q{padding:4px 9px;cursor:pointer}
.pill.flash{animation:flash .5s steps(2)}
@keyframes flash{50%{background:var(--gold);color:var(--ol)}}
.ico{width:16px;height:16px;vertical-align:-3px;flex:none}
#sky{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;background:#3f8fd8}
#scene{position:relative}
#world{position:absolute;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#labels{position:absolute;top:0}
.fl{position:absolute;left:0;right:0;cursor:pointer}
.fnum{position:absolute;top:0;bottom:0;padding-top:5px;text-align:center;color:#cbbfd6;font-size:12px;font-weight:700;text-shadow:0 2px 0 #000}
.chip{position:absolute;top:6px;background:rgba(20,14,28,.82);color:var(--cream);font-size:13px;font-weight:600;padding:1px 6px 2px;border:2px solid #000;white-space:nowrap;max-width:58%;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.chip .ico{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.phead{display:flex;gap:12px;align-items:center;margin:4px 0 6px}
.pbig{width:66px;flex:none;background:#dfc6ad;border:3px solid #000;padding:8px 6px 0;image-rendering:pixelated}
.dream{display:inline-flex;gap:6px;align-items:center;background:#fff0a0;border:3px solid #000;padding:3px 8px;font-size:15px;margin-top:4px}
.trow{display:flex;align-items:center;gap:7px;padding:5px 8px;border:3px solid transparent;font-size:15px}
.trow span{flex:1}.trow.dr{background:#fff0a0;border-color:#000}
.tap{cursor:pointer}
.pill .ub{background:#ff3b5c;color:#fff;border:2px solid #000;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;margin-left:2px;padding:0 3px}
.post{background:#fff6e4;border:3px solid #000;padding:8px 10px;margin:8px 0;display:flex;gap:10px;box-shadow:inset 0 -3px 0 #dfc6ad}
.post .por{width:28px;align-self:flex-start}.post .nm{font-weight:700;font-size:15px}.post .tm{font-size:12px;color:#8a5a35;margin-left:6px;font-weight:400}.post .tx{font-size:15px;line-height:1.35;margin-top:2px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.badge.rdy{background:#2fbf5a;padding:0}.badge.rdy img{width:16px;height:16px;image-rendering:pixelated}
.card .t{display:block!important}
#toast{display:block!important}#toast .ico{margin:0 2px}
.rt .chip{gap:0}.rt .chip .ico{margin-right:3px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.sw img{width:100%;border:3px solid #000;cursor:pointer;display:block}
.sw img.on{outline:3px solid var(--orange);outline-offset:2px}
.n{font-family:"Silkscreen",monospace;font-weight:400;letter-spacing:0}
.rt{position:absolute;top:6px;right:8px;display:flex;gap:3px;align-items:center}
.rt .chip{position:static;max-width:none;display:flex;align-items:center;gap:3px}
.sq{width:11px;height:11px;border:2px solid #000;background:#fff6e4}
.sq.ok{background:#6cd65a}.sq.out{background:#ff5a6a}.sq.busy{background:var(--gold)}.sq.lock{opacity:.3}
.badge{background:#ff3b5c;color:#fff;border:3px solid #000;width:26px;height:26px;font-weight:700;font-size:18px;box-shadow:0 2px 0 #000;display:grid;place-items:center;animation:bob 1s steps(2) infinite}
.vis{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
footer{display:flex;gap:8px;padding:9px 10px calc(10px + env(safe-area-inset-bottom));background:#1b1626;border-top:3px solid #000;z-index:3}
.btn{flex:1;white-space:nowrap;border:3px solid #000;padding:11px 6px 12px;font:inherit;font-weight:700;font-size:16px;color:var(--ol);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--orange);box-shadow:inset 0 3px 0 #ffb066,inset 0 -4px 0 #b8431f}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #b8431f}
.btn.lift{background:var(--gold);box-shadow:inset 0 3px 0 #fff0a0,inset 0 -4px 0 #c4902a}
.btn.lift.on{animation:pulse .7s steps(2) infinite}
@keyframes pulse{50%{background:#fff0a0}}
.btn:disabled{filter:grayscale(.7) brightness(.7);animation:none}
#shade{position:absolute;inset:0;background:rgba(10,6,16,.55);z-index:5;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:absolute;left:6px;right:6px;bottom:0;max-height:80%;background:var(--cream);border:3px solid #000;border-bottom:none;z-index:6;transform:translateY(105%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:inset 0 3px 0 #fff6e4,inset 3px 0 0 #fff6e4}
#app.open #shade{opacity:1;pointer-events:auto}
#app.open #sheet{transform:none}
.grab{width:40px;height:5px;background:#c9a98a;margin:8px auto 2px;flex:none}
#sheetBody{overflow-y:auto;padding:4px 14px calc(18px + env(safe-area-inset-bottom))}
h2{font-family:"Pixelify Sans","Fredoka",sans-serif;font-size:22px;font-weight:700;margin:4px 0 2px;display:flex;align-items:center;gap:6px}
h3{font-size:13px;font-weight:700;margin:14px 0 2px;text-transform:uppercase;letter-spacing:.06em;color:#8a5a35}
.muted{color:#8a5a35;font-size:14px}
.art{display:block;width:100%;border:3px solid #000;margin:6px 0 2px}
.card{background:#fff6e4;border:3px solid #000;padding:7px 9px;margin:7px 0;display:flex;align-items:center;gap:10px;box-shadow:inset 0 -3px 0 #dfc6ad}
.por{width:30px;flex:none;background:#dfc6ad;border:2px solid #000;padding:3px 0 0;image-rendering:pixelated}
.card .mid{flex:1;min-width:0}
.card .t{font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px}
.card .s{font-size:13px;color:#6b3f26;line-height:1.3}
.sbtn{border:3px solid #000;padding:6px 9px 7px;font:inherit;font-weight:700;font-size:14px;background:var(--gold);box-shadow:inset 0 2px 0 #fff0a0,inset 0 -3px 0 #c4902a;cursor:pointer;white-space:nowrap;color:var(--ol);display:inline-flex;align-items:center;gap:4px}
.sbtn:active{transform:translateY(2px)}
.sbtn.alt{background:#fff6e4;box-shadow:inset 0 -3px 0 #dfc6ad}
.sbtn.red{background:#ff8a9a;box-shadow:inset 0 2px 0 #ffc0c8,inset 0 -3px 0 #b84a6a}
.sbtn.gem{background:#8fe0ff;box-shadow:inset 0 2px 0 #e8fbff,inset 0 -3px 0 #3a9ad9}
.sbtn.green{background:#8fd14f;box-shadow:inset 0 2px 0 #c4e86a,inset 0 -3px 0 #3f7a2f}
.sbtn:disabled{opacity:.45}
.wide{width:100%;margin-top:8px;padding:11px;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.catbtn{border:3px solid #000;padding:0 0 7px;background:#fff6e4;font:inherit;text-align:center;cursor:pointer;color:var(--ol);box-shadow:inset 0 -3px 0 #dfc6ad;overflow:hidden}
.catbtn:active{transform:translateY(2px)}
.catbtn:disabled{opacity:.45}
.catbtn img{display:block;width:100%;border-bottom:3px solid #000;margin-bottom:5px}
.catbtn b{display:block;font-size:16px}
.catbtn small{font-size:12px;color:#8a5a35}
.bar{height:9px;background:#dfc6ad;border:2px solid #000;margin-top:4px}
.bar i{display:block;height:100%;background:#6cd65a;box-shadow:inset 0 2px 0 #b0f0a0}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.stars img{width:11px;height:11px}
.stars img.off{opacity:.25}
p.help{font-size:15px;line-height:1.45;margin:6px 0}
p.help img{width:15px;height:15px;vertical-align:-2px}
.liftrow{display:flex;align-items:center;justify-content:center;gap:14px;background:#1b1626;border:3px solid #000;padding:10px;margin:6px 0;color:var(--cream);font-size:24px}
.liftrow img{width:56px}
.pill.off{opacity:.4}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);background:#1b1626;color:var(--cream);padding:7px 13px 8px;font-weight:600;font-size:15px;z-index:9;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92%;text-align:center;border:3px solid #000;box-shadow:inset 0 2px 0 #4a3a5e;display:flex;align-items:center;gap:6px}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== torengame-HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:rgba(30,26,50,.78);border-bottom:3px solid rgba(0,0,0,.45);font-family:"Silkscreen",monospace;color:#fff}
.hb{display:flex;align-items:center;gap:6px;font-size:18px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000}
.hb .ico{width:22px;height:22px}
.hmid{display:flex;gap:6px}
.sqs{width:40px;height:34px;border:3px solid #000;background:#6a58a8;color:#fff;font-family:"Silkscreen",monospace;font-size:18px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000;box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer}
.sqs .ico{width:20px;height:20px}
.sqs .ub{position:absolute;top:-8px;right:-8px;background:#ff3b5c;color:#fff;border:2px solid #000;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 2px}
footer{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#2c2648;border-top:3px solid #000;z-index:3}
.money{flex:1;display:flex;flex-direction:column;gap:3px;font-family:"Silkscreen",monospace;color:#fff;font-size:19px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000}
.money span{display:flex;align-items:center;gap:8px}.money .ico{width:22px;height:22px}
.sqb{width:64px;height:58px;border:3px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:"Silkscreen",monospace;font-size:11px;color:#fff;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000;cursor:pointer}
.sqb .ico{width:28px;height:28px}
.sqb.build{background:#e8463c;box-shadow:inset 0 4px 0 #ff8a7a,inset 0 -5px 0 #a02a24}
.sqb.lift{background:#f2b62e;box-shadow:inset 0 4px 0 #ffe08a,inset 0 -5px 0 #b8801a}
.sqb.lift.on{animation:pulse2 .7s steps(2) infinite}@keyframes pulse2{50%{background:#ffd860}}
.sqb:active{transform:translateY(2px)}.sqb:disabled{filter:grayscale(.8) brightness(.75);animation:none}
#sky{background:#6ab4ec}
/* ===== naamstrookjes onder de verdiepingen ===== */
.strip{position:absolute;display:flex;align-items:center;justify-content:space-between;padding:0 5px;font-family:"Silkscreen",monospace;color:#fff;text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000;white-space:nowrap;overflow:hidden;pointer-events:none}
.strip .nm{overflow:hidden;text-overflow:ellipsis}.strip .nm .ico{width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:4px}
.strip .sr{display:flex;gap:3px;align-items:center}.strip .sr .ico{width:1.1em;height:1.1em}
.strip .sq{width:9px;height:9px;border-width:2px}
.strip .lv{color:#ffd84a;margin-left:4px}
.fnum{font-family:"Silkscreen",monospace;font-size:13px;color:#fff;text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000}
.crsign{position:absolute;width:76px;text-align:center;background:#3a78d8;border:3px solid #000;color:#fff;font-family:"Silkscreen",monospace;font-size:12px;line-height:1.25;padding:3px 2px;text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000;box-shadow:inset 0 3px 0 #6aa0f0,inset 0 -3px 0 #2050a0;cursor:pointer}
.crsign .ico{width:12px;height:12px;vertical-align:-1px}
.crsign:before,.crsign:after{content:"";position:absolute;top:-14px;width:2px;height:11px;background:#2a2433}.crsign:before{left:14px}.crsign:after{right:14px}
.rt{top:4px!important}
.badge{width:30px!important;height:30px!important;font-size:20px!important;font-family:"Silkscreen",monospace}.badge.rdy img{width:18px;height:18px}
/* ===== knoppen en kopjes in pixelstijl ===== */
h2,h3,.sbtn,.catbtn b,.card .t,.chip,#toast,.trow span,.dream,.post .nm{font-family:"Silkscreen",monospace!important;font-weight:400!important}
h2{font-size:20px}h3{font-size:12px;letter-spacing:.02em}.sbtn{font-size:13px}.card .t{font-size:14px}.chip{font-size:12px}#toast{font-size:14px;line-height:1.35}
.chip{background:rgba(30,26,50,.85);color:#fff}
#start{position:absolute;inset:0;z-index:20;background:linear-gradient(rgba(60,120,200,.55),rgba(30,26,50,.85));display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .35s}
#start.hide{opacity:0;pointer-events:none}
.st-in{text-align:center;color:#fff;font-family:"Silkscreen",monospace}
.st-t{font-size:50px;line-height:.95;text-shadow:3px 0 0 #000,-3px 0 0 #000,0 3px 0 #000,0 -3px 0 #000,3px 3px 0 #000,0 8px 0 #2a2433;color:#ffd84a}
.st-s{font-family:"Pixelify Sans",sans-serif;font-size:18px;margin:22px 0 34px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000}
.st-go{display:inline-block;background:#e8463c;border:3px solid #000;padding:12px 18px;font-size:18px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000;box-shadow:inset 0 4px 0 #ff8a7a,inset 0 -5px 0 #a02a24;animation:pulse3 1s steps(2) infinite}
@keyframes pulse3{50%{transform:scale(1.05)}}
#hud{padding-top:calc(6px + env(safe-area-inset-top))!important}
#toast{top:calc(64px + env(safe-area-inset-top))!important}
#sheet{max-height:calc(80% - env(safe-area-inset-top))}
</style>
</head>

  return `<h2>${f.name}</h2>${art}<p class="muted">${CATS[f.type].label} · verdieping ${i}</p>
  <h3>Personeel (${ws.length}/${MAX_WORKERS})</h3>
  ${ws.map(r=>resCard(r,`<button class="sbtn alt" data-act="fire" data-i="${i}" data-j="${r.id}">Ontslaan</button>`,f.type)).join('')}
  ${ws.length<MAX_WORKERS?`<button class="sbtn green wide" data-act="hire" data-i="${i}">+ Personeel aannemen</button>`:''}
  <h3>Zaak-niveau ${f.lvl||0}/${SHOP_MAX}</h3>
  <div class="card"><div class="mid"><div class="t">${I('star')} +${(f.lvl||0)*25}% prijs · +${(f.lvl||0)*12}% voorraad</div><div class="s">${(f.lvl||0)<SHOP_MAX?`Volgende: +${((f.lvl||0)+1)*25}% prijs · +${((f.lvl||0)+1)*12}% voorraad`:'Maximaal niveau!'}${f.boostEnd&&f.boostEnd>now()?`<br>${I('star')} Dubbele verkoop nog ${fmtT((f.boostEnd-now())/1000)}`:''}</div></div>
  ${(f.lvl||0)<SHOP_MAX?`<button class="sbtn" data-act="shopUp" data-i="${i}" ${S.coins>=shopUpCost(f)?'':'disabled'}>Upgrade ${I('coin')}${fmt(shopUpCost(f))}</button>`:''}</div>
  <h3>Voorraad</h3>
  ${f.products.map((p,j)=>{const tr=TIERS[p.tier],locked=p.tier>=ws.length;let right;
    if(locked)right=`<span class="s">${I('lock')} ${p.tier+1} medewerker${p.tier?'s':''}</span>`;
    else if(p.ready)right=`<button class="sbtn green" data-act="collect" data-i="${i}">${I('box')} Inruimen</button>`;
    else if(p.restockEnd)right=`<button class="sbtn gem" data-act="rushStock" data-i="${i}" data-j="${j}" ${S.gems>=1?'':'disabled'}>${I('clock')} ${fmtT((p.restockEnd-now())/1000)} · 1${I('gem')}</button>`;
    else right=`<button class="sbtn" data-act="restock" data-i="${i}" data-j="${j}" ${S.coins>=tr.cost?'':'disabled'}>Inslaan ${I('coin')}${tr.cost}</button>`;
    return `<div class="card" style="${locked?'opacity:.55':''}"><div class="mid"><div class="t">${p.name}</div><div class="s">${p.stock} op voorraad · ${I('coin')}${+priceOf(f,p).toFixed(1)} per stuk · levert ${qtyOf(f,p)} · ${fmtT(restockTime(i,p))}</div><div class="bar"><i style="width:${Math.min(100,p.stock/qtyOf(f,p)*100)}%"></i></div></div>${right}</div>`}).join('')}${manageHTML(i)}`;
}
function renderSheet(reset){const app=$('#app'),body=$('#sheetBody');if(!ui.sheet){app.classList.remove('open');return}const st=reset?0:body.scrollTop;const html=sheetHTML();if(!ui.sheet){app.classList.remove('open');return}body.innerHTML=html;numify(body);body.scrollTop=st;app.classList.add('open')}
function numify(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];while(w.nextNode()){const n=w.currentNode;if(/\d/.test(n.nodeValue)&&!(n.parentNode.classList&&n.parentNode.classList.contains('n')))list.push(n)}
  list.forEach(n=>{const sp=document.createElement('span');sp.innerHTML=n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(\d[\d.,:]*\d|\d)/g,'<span class="n">$1</span>');n.replaceWith(...sp.childNodes)})}
function renderAll(){layout();render();renderSheet()}
function flash(sel){const el=$(sel);el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
let toastT;function toast(m){const t=$('#toast');t.innerHTML=m;numify(t);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300)}
function scrollBottom(){const sk=$('#sky');sk.scrollTop=sk.scrollHeight}

/* ================= START ================= */
const had=load();
if(had){const away=Math.min((now()-(S.last||now()))/1000,4*3600);if(away>5){const got=tick(away);if(got>0)setTimeout(()=>toast(`Terwijl je weg was: +${fmt(got)} ${I('coin')}`),500)}}
else ui.firstRun=true;
renderAll();scrollBottom();requestAnimationFrame(draw);
let lastT=now();
setInterval(()=>{const t=now(),dt=(t-lastT)/1000;lastT=t;tick(dt);renderAll();save()},1000);
window.addEventListener('resize',()=>{ui.lkey='';renderAll()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(AU.ctx)AU.ctx.suspend()}else if(AU.ctx&&AU.started)AU.ctx.resume()});
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,auInit,{passive:true}));
if(document.fonts)document.fonts.ready.then(()=>render());
</script>
</body>
